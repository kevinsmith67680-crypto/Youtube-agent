# Continuous integration. Runs on pushes and pull requests with read-only permissions and
# no secrets: nothing here deploys, and no credential is available to pull-request code.
# Default tests run offline against a throw-away PostgreSQL service; live-provider tests
# (pytest -m live) are never run here.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  TEST_DB: postgresql+psycopg://trend_agent:ci_only_password@127.0.0.1:5432/trend_agent_test

jobs:
  lint-type:
    name: lint and type check (backend)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src
      - run: mypy tests --strict

  unit:
    name: unit tests (offline, no database)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}", cache: pip}
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit -q -p no:cacheprovider

  integration:
    name: integration, migration and end-to-end tests (PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trend_agent
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: trend_agent_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trend_agent" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      TREND_AGENT_TEST_DATABASE_URL: ${{ env.TEST_DB }}
      TREND_AGENT_REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - run: pip install -e ".[dev]"
      - name: full suite with coverage
        run: pytest -q -p no:cacheprovider --cov=trend_agent --cov-report=term-missing:skip-covered

  migration-validation:
    name: migration validation (empty database)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: trend_agent
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: trend_agent_migrations
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trend_agent" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      TREND_AGENT_DATABASE_URL: postgresql+psycopg://trend_agent:ci_only_password@127.0.0.1:5432/trend_agent_migrations
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - run: pip install -e .
      - run: alembic upgrade head
      - run: alembic check
      - run: alembic downgrade base
      - run: alembic upgrade head
      - name: schema revision matches the code
        run: |
          python - <<'PY'
          import sqlalchemy as sa, os
          from trend_agent.db import EXPECTED_SCHEMA_REVISION
          e = sa.create_engine(os.environ["TREND_AGENT_DATABASE_URL"])
          with e.connect() as c:
              rev = c.execute(sa.text("select version_num from alembic_version")).scalar_one()
          assert rev == EXPECTED_SCHEMA_REVISION, (rev, EXPECTED_SCHEMA_REVISION)
          print("schema", rev)
          PY

  security:
    name: security scans
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "${{ env.PYTHON_VERSION }}", cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: "${{ env.NODE_VERSION }}"}
      - run: pip install -e . && pip install pip-audit bandit detect-secrets
      - name: dependency audit (Python)
        run: pip-audit --skip-editable --progress-spinner off
      - name: static analysis (bandit; medium and high severity fail the build)
        run: bandit -q -r src --severity-level medium
      - name: secret scan (new secrets fail the build)
        run: |
          git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
      - name: dependency audit (dashboard production dependencies)
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm audit --omit=dev --audit-level=low

  frontend:
    name: frontend (type check, unit tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: docker build (no push)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [lint-type]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: backend image
        run: docker build -t trend-agent-backend:ci .
      - name: frontend image
        run: docker build -t trend-agent-frontend:ci frontend
      - name: backend image runs as non-root and has the CLI
        run: |
          test "$(docker run --rm --entrypoint id trend-agent-backend:ci -u)" != "0"
          docker run --rm trend-agent-backend:ci --help > /dev/null
      - name: compose files are valid
        run: |
          docker compose config -q
          docker compose --profile app config -q
          BACKEND_IMAGE=x FRONTEND_IMAGE=y TREND_AGENT_DATABASE_URL=postgresql+psycopg://u:p@db/x \
          TREND_AGENT_API_TOKEN=t TREND_AGENT_VERIFICATION_SIGNING_KEY=k \
          TREND_AGENT_API_CORS_ORIGINS=https://example.invalid DASHBOARD_BASIC_AUTH_USER=u \
          DASHBOARD_BASIC_AUTH_PASSWORD=p docker compose -f docker-compose.prod.yml config -q
