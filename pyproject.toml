[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "youtube-trend-agent"
version = "0.7.0"
description = "YouTube Search Demand Intelligence Agent - Phases 1-7: data acquisition, discovery, monitoring, surge detection, search-intent and content-gap analysis, trend forecasting, evidence-verified video recommendations and an intelligence dashboard API."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "sqlalchemy>=2.0.30,<2.1",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.1,<4.0",
    "typer>=0.12,<1.0",
    "pyyaml>=6.0,<7.0",
    # Untrusted RSS/Atom XML is parsed with defusedxml (entity-expansion safe).
    "defusedxml>=0.7,<1.0",
    # Phase 4 statistics (robust baselines, change points, multiple-testing control).
    "numpy>=2.0,<3.0",
    "scipy>=1.13,<2.0",
    # Phase 6 forecasting (models are stored as JSON / LightGBM text, never pickled).
    "scikit-learn>=1.5,<2.0",
    "lightgbm>=4.3,<5.0",
    # Phase 7 dashboard API (served locally; the browser UI lives in frontend/).
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    # Windows has no system IANA tz database; zoneinfo needs this there.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "types-defusedxml>=0.7",
    "scipy-stubs>=1.13",
]

[project.scripts]
trend-agent = "trend_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trend_agent"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "C4", "DTZ", "RUF", "SIM", "PT", "RET", "ASYNC", "TID",
]
ignore = [
    "S101",   # assert is fine in tests and for internal invariants
    "RUF012", # mutable class attrs are fine for SQLAlchemy/Typer patterns
    "SIM905", # whitespace-split code tables are more readable than 250-line lists
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "DTZ001"]
"migrations/**" = ["E501"]
# operator scripts run fixed, trusted commands (git, uv, the project's own tools)
"scripts/**" = ["S603", "S607"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["trend_agent"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
# Third-party ML libraries without type information (Phase 6 forecasting).
module = ["sklearn.*", "lightgbm.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers -m 'not live'"
markers = [
    "db: requires a reachable PostgreSQL database (TREND_AGENT_TEST_DATABASE_URL)",
    "live: performs real, quota-consuming requests against external APIs (opt-in only)",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["trend_agent"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
