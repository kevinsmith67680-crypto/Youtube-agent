# Public GitHub repositories whose releases are tracked via the documented REST API
# (GET /repos/{owner}/{repo}/releases). Unauthenticated: 60 requests/hour; set
# TREND_AGENT_GITHUB_TOKEN for 5,000/hour.
sources:
  - {key: "github:vllm-project/vllm", provider: github_releases, name: vLLM releases, source_type: repository, category: ai, reference: vllm-project/vllm, evidence_type: code_release, entity_hint: vLLM, entity_hint_type: software, reliability: 0.9, min_poll_interval_minutes: 720, verified: true}
  - {key: "github:ollama/ollama", provider: github_releases, name: Ollama releases, source_type: repository, category: ai, reference: ollama/ollama, evidence_type: code_release, entity_hint: Ollama, entity_hint_type: software, reliability: 0.9, min_poll_interval_minutes: 720, verified: true}
  - {key: "github:huggingface/transformers", provider: github_releases, name: Transformers releases, source_type: repository, category: ai, reference: huggingface/transformers, evidence_type: code_release, entity_hint: Transformers, entity_hint_type: framework, reliability: 0.9, min_poll_interval_minutes: 720, verified: true}
  - {key: "github:langchain-ai/langchain", provider: github_releases, name: LangChain releases, source_type: repository, category: ai, reference: langchain-ai/langchain, evidence_type: code_release, entity_hint: LangChain, entity_hint_type: framework, reliability: 0.85, min_poll_interval_minutes: 720, verified: true}
  - {key: "github:ggml-org/llama.cpp", provider: github_releases, name: llama.cpp releases, source_type: repository, category: ai, reference: ggml-org/llama.cpp, evidence_type: code_release, entity_hint: llama.cpp, entity_hint_type: software, reliability: 0.85, min_poll_interval_minutes: 720, verified: true}
  - {key: "github:microsoft/vscode", provider: github_releases, name: VS Code releases, source_type: repository, category: technology, reference: microsoft/vscode, evidence_type: code_release, entity_hint: Visual Studio Code, entity_hint_type: software, reliability: 0.9, min_poll_interval_minutes: 1440, verified: true}
  - {key: "github:nodejs/node", provider: github_releases, name: Node.js releases, source_type: repository, category: technology, reference: nodejs/node, evidence_type: code_release, entity_hint: Node.js, entity_hint_type: software, reliability: 0.9, min_poll_interval_minutes: 1440, verified: true}
  - {key: "github:vercel/next.js", provider: github_releases, name: Next.js releases, source_type: repository, category: technology, reference: vercel/next.js, evidence_type: code_release, entity_hint: Next.js, entity_hint_type: framework, reliability: 0.9, min_poll_interval_minutes: 1440, verified: true}
  - {key: "github:rust-lang/rust", provider: github_releases, name: Rust releases, source_type: repository, category: technology, reference: rust-lang/rust, evidence_type: code_release, entity_hint: Rust, entity_hint_type: technology, reliability: 0.9, min_poll_interval_minutes: 1440, verified: true}
