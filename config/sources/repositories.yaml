# Strategy B - established projects: public GitHub repositories monitored for new releases
# (GET /repos/{owner}/{repo} for metadata + GET /repos/{owner}/{repo}/releases with an
# ETag). Each poll costs 2 core requests (a 304 does not count against GitHub's limit).
# Unauthenticated: 60 requests/hour; set GITHUB_TOKEN for 5,000/hour.
sources:
  - {key: "github:vllm-project/vllm", provider: github, name: vLLM releases, source_type: repository, category: ai, reference: vllm-project/vllm, evidence_type: code_release, entity_hint: vLLM, entity_hint_type: software, reliability: 0.9, min_poll_interval_minutes: 720, verified: true}
  - {key: "github:ollama/ollama", provider: github, name: Ollama releases, source_type: repository, category: ai, reference: ollama/ollama, evidence_type: code_release, entity_hint: Ollama, entity_hint_type: software, reliability: 0.9, min_poll_interval_minutes: 720, verified: true}
