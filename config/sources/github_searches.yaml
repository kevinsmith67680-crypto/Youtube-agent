  - {key: "github:search:ai-agent:active", provider: github, name: "GitHub topic ai-agent (established, active)", source_type: repository_search, category: ai, reference: "topic:ai-agent", reliability: 0.7, min_poll_interval_minutes: 1440, params: {strategy: active}}
  - {key: "github:search:llm:active", provider: github, name: "GitHub topic llm (established, active)", source_type: repository_search, category: ai, reference: "topic:llm", reliability: 0.7, min_poll_interval_minutes: 1440, params: {strategy: active}}
