  - {key: "github:search:robotics:emerging", provider: github, name: "GitHub topic robotics (new repos)", source_type: repository_search, category: technology, reference: "topic:robotics", pool: exploration, reliability: 0.6, min_poll_interval_minutes: 1440, params: {strategy: emerging}}
  - {key: "github:search:open-source-ai:emerging", provider: github, name: "GitHub topic open-source-ai (new repos)", source_type: repository_search, category: ai, reference: "topic:open-source-ai", pool: exploration, reliability: 0.6, min_poll_interval_minutes: 1440, params: {strategy: emerging}}
  # --- further focus areas (video, image, voice, benchmarks, AI browsers, automation, SDKs)
