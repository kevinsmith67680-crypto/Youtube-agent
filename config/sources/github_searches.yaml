# GitHub repository searches (GET /search/repositories), narrowed at fetch time by the
# strategy in discovery.yaml (providers.github.params.strategies):
#   emerging - created within the last 21 days, >= 2 stars, no forks/archived, by stars
#   active   - pushed within the last 7 days, >= 500 stars (established, still moving)
# `reference` is the base query in GitHub search syntax (topic:, "phrase" in:name,
# description, language:, ...). Every query here was checked against the live API on
# 2026-11-14 and returned results. One search request per poll; the poll interval keeps
# each topic from being searched again before new repositories can plausibly appear.
# Results are external developer activity: never search interest or search volume.
sources:
  # --- requested seeds: strategy A (emerging repositories)
  - {key: "github:search:ai-agent:emerging", provider: github, name: "GitHub topic ai-agent (new repos)", source_type: repository_search, category: ai, reference: "topic:ai-agent", pool: exploration, reliability: 0.6, min_poll_interval_minutes: 720, params: {strategy: emerging}}
  - {key: "github:search:coding-agent:emerging", provider: github, name: "GitHub topic coding-agent (new repos)", source_type: repository_search, category: ai, reference: "topic:coding-agent", pool: exploration, reliability: 0.6, min_poll_interval_minutes: 720, params: {strategy: emerging}}
  - {key: "github:search:llm:emerging", provider: github, name: "GitHub topic llm (new repos)", source_type: repository_search, category: ai, reference: "topic:llm", pool: exploration, reliability: 0.6, min_poll_interval_minutes: 720, params: {strategy: emerging}}
  - {key: "github:search:local-llm:emerging", provider: github, name: "GitHub topic local-llm (new repos)", source_type: repository_search, category: ai, reference: "topic:local-llm", pool: exploration, reliability: 0.6, min_poll_interval_minutes: 720, params: {strategy: emerging}}
  - {key: "github:search:agent-framework:emerging", provider: github, name: "GitHub topic agent-framework (new repos)", source_type: repository_search, category: ai, reference: "topic:agent-framework", pool: exploration, reliability: 0.6, min_poll_interval_minutes: 720, params: {strategy: emerging}}
  - {key: "github:search:browser-automation:emerging", provider: github, name: "GitHub topic browser-automation (new repos)", source_type: repository_search, category: technology, reference: "topic:browser-automation", pool: exploration, reliability: 0.6, min_poll_interval_minutes: 720, params: {strategy: emerging}}
  - {key: "github:search:multimodal-ai:emerging", provider: github, name: "GitHub topic multimodal-ai (new repos)", source_type: repository_search, category: ai, reference: "topic:multimodal-ai", pool: exploration, reliability: 0.6, min_poll_interval_minutes: 1440, params: {strategy: emerging}}
  - {key: "github:search:ai-coding:emerging", provider: github, name: "GitHub topic ai-coding (new repos)", source_type: repository_search, category: ai, reference: "topic:ai-coding", pool: exploration, reliability: 0.6, min_poll_interval_minutes: 720, params: {strategy: emerging}}
  - {key: "github:search:developer-tools:emerging", provider: github, name: "GitHub topic developer-tools (new repos)", source_type: repository_search, category: technology, reference: "topic:developer-tools", pool: exploration, reliability: 0.6, min_poll_interval_minutes: 720, params: {strategy: emerging}}
