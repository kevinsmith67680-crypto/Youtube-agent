# Keyword discovery configuration (Phase 2).
# Discovery finds and prioritises CANDIDATE keywords. Nothing configured here measures
# search demand; see docs/keyword_discovery.md.
version: 1

# Share of each run's fetch budget per category. Must sum to 1.0. These steer effort;
# they do not force the final keyword mix (no candidates are invented to fill a quota).
category_budgets:
  ai: 0.45
  technology: 0.25
  gaming: 0.30

# Share of each category's fetch slots reserved for exploration (new entities, sources
# never fetched before). Unused exploration slots fall back to exploitation and vice versa.
exploration_share: 0.20

regions: [US, GB]
languages: [en]

run:
  max_fetches_per_run: 24        # total source fetches across categories per `discover run --all`
  max_items_per_source: 50
  lookback_days: 14              # only ask sources for material newer than this
  max_item_age_days: 365         # older material is flagged outdated and not expanded
  fetch_concurrency: 4
  fetch_timeout_seconds: 60
  max_failure_backoff_multiplier: 16   # failing sources wait up to 16x their poll interval

expansion:
  max_depth: 2                   # 0 none, 1 entity templates, 2 + grounded comparisons
  max_templates_per_entity: 10
  max_comparisons_per_entity: 2
  max_keywords_per_run: 400
  min_entity_confidence: 0.6
  max_query_words: 10

clustering:
  backend: lexical               # 'embedding' requires an embedding backend (not bundled)
  intent_similarity_threshold: 0.5
  topic_similarity_threshold: 0.6

scoring:
  version: priority-v1           # heuristic weights, not experimentally validated
  weights:
    novelty: 0.25
    freshness: 0.20
    corroboration: 0.20
    relevance: 0.15
    intent_actionability: 0.10
    evidence_quality: 0.10
  freshness_half_life_days: 7
  recency_half_life_days: 7
  prioritize_threshold: 45

lifecycle:
  dormant_after_days: 30

# Per-provider switches, local daily request caps (on top of each API's own limits) and
# retention of stored source items. retention_days empty = keep (first-party/public feeds);
# YouTube is capped at 30 days by policy regardless of this value. daily_request_limit
# applies to the HTTP providers and to youtube_discovery (its share of the YouTube quota).
providers:
  youtube_discovery:
    enabled: true
    daily_request_limit: 40      # discovery fetches/day; each search also uses 1 of the
                                 # 100/day search.list calls (Phase 1 YouTube quota)
    retention_days: 30
    params: {search_results_per_query: 25}
  feeds:
    enabled: true
    daily_request_limit: 500
    retention_days: 90
  github:                        # GitHub REST API: repository search + monitored releases
    enabled: true                # also needs GITHUB_API_ENABLED (default true)
    daily_request_limit: 200     # not used: GitHub has its own core/search budgets below
    retention_days: 180
    params:
      api:
        per_page: 30             # search results per page (max 100)
        max_pages: 1             # bounded pagination per search
        release_page_size: 10    # latest releases per monitored repository
        core_daily_budget: 1500  # local daily budgets (UTC), far below GitHub's limits
        search_daily_budget: 300
        min_remaining_core: 25   # stop before GitHub's live limit is exhausted
        min_remaining_search: 2
        dedup_ttl_seconds: 600   # identical requests within 10 min reuse the response
      strategies:
        # A. emerging: created recently; light filters so new projects are not excluded
        emerging: {created_within_days: 21, min_stars: 2, sort: stars}
        # established and active: pushed this week (feeds momentum observations)
        active: {pushed_within_days: 7, min_stars: 500, sort: updated}
      quality:
        min_description_chars: 20
        min_relevance: 0.34
      momentum:
        min_interval_hours: 6    # no rate from observations closer than this
  hackernews:
    enabled: true
    daily_request_limit: 300
    retention_days: 90
    params: {categories: [ai, technology]}
  hackernews_firebase:           # official Hacker News Firebase API (lists + items; no search)
    enabled: true                # also needs TREND_AGENT_HACKERNEWS_API_ENABLED (default true)
    daily_request_limit: 20000   # not used: see params.client.daily_request_budget
    retention_days: 90
    params:
      client:
        daily_request_budget: 20000  # local cap; the API documents no limit, we keep one
        max_concurrency: 6           # parallel item requests
        item_cache_seconds: 120      # identical item requests within 2 min reuse the answer
        list_cache_seconds: 60
        max_items_per_list: 60       # items read per list per poll (per-source max_items <=)
      classifier:
        min_relevance: 0.3           # one specific term in the title is enough
        ambiguity_ratio: 0.8         # 2nd category within 80% of the 1st -> ambiguous (kept)
      priority:                      # story priority weights (heuristic; components stored)
        relevance: 0.25
        novelty: 0.10
        recency: 0.15
        discussion_activity: 0.15
        launch_significance: 0.15
        corroboration: 0.08
        entity_verification: 0.07
        source_reliability: 0.05
      refresh:                       # repeated observations of tracked stories
        high_priority_minutes: 15
        normal_priority_minutes: 60
        low_priority_minutes: 240
        high_priority_threshold: 60
        normal_priority_threshold: 35
        stop_after_hours: 72
        max_per_run: 60
      momentum:
        min_interval_minutes: 10
        rising_score_per_hour: 20
        rising_comments_per_hour: 15
  reddit:
    enabled: true
    daily_request_limit: 200
    retention_days: 30
  google_trends_discovery:
    enabled: true                # needs Trends API alpha access + a related-queries transport
  curated_seeds:
    enabled: true                # local configuration; no requests
