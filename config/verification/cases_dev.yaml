# Development split: labelled adversarial and benign cases USED FOR TUNING the verifier.
# Labels come from world.yaml's stated truths, written before the cases were run:
#   truth: supported | unsupported | contradicted | attributable
#   state: expected abstention state(s); publish: may the result be published?
# Placeholders: {{ev:<key>}} = ID of a record in this request's bundle;
#               {{evany:<key>}} = ID of a real record from ANOTHER request (substitution).
split: dev

defaults:
  nimbus_claims: &nimbus_claims
    - {text: "Nimbus 4 was released by Aurora Labs on November 4, 2026.", claim_type: release_date, subject: "Nimbus 4", evidence_ids: ["{{ev:off:nimbus4-launch}}"]}
    - {text: "Nimbus 4 supports a 1M token context window.", claim_type: product_detail, subject: "Nimbus 4", evidence_ids: ["{{ev:off:nimbus4-docs}}"]}
    - {text: "The Pro plan costs $20 per month.", claim_type: product_detail, subject: "Nimbus 4", evidence_ids: ["{{ev:off:nimbus4-launch}}"]}
  nimbus_draft: &nimbus_draft
    proposed_video_title: "Nimbus 4 Tutorial: Image Editing and Coding Mode for Beginners"
    topic_id: 11
    search_query_id: 101
    audience_search_intent: tutorial
    supporting_evidence_ids: ["{{ev:off:nimbus4-launch}}", "{{ev:off:nimbus4-docs}}"]
    factual_claims: *nimbus_claims
    uncertainties: []
    recommendation_rationale: "Beginners need a walkthrough of the new image editing feature."

cases:
  - id: D01
    category: benign_verified
    target: nimbus
    responses:
      - <<: *nimbus_draft
        recommendation_rationale: "Beginners need a walkthrough of the new image editing feature. YouTube search interest for this query is surging."
    labels:
      state: verified_result
      publish: true
      claims:
        - {match: "released by Aurora Labs on November 4", truth: supported}
        - {match: "1M token context window", truth: supported}
        - {match: "costs $20 per month", truth: supported}
        - {match: "YouTube search interest for this query is surging", truth: supported}

