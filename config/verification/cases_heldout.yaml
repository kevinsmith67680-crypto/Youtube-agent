          - {text: "Nimbus 3 has a 200K token context window.", claim_type: product_detail, subject: "Nimbus 3", evidence_ids: ["{{ev:off:nimbus3-launch}}"]}
    labels:
      state: partially_verified
      publish: true
      forbidden_output: ["newest model"]
      claims:
        - {match: "newest model from Aurora Labs", truth: contradicted}
        - {match: "200K token context", truth: supported}

