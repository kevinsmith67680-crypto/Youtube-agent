# Held-out split: written together with the development split, BEFORE any evaluation run,
# and NOT used for tuning. Results are reported from the first run (see
# docs/verification_evaluation.md). Labels come from world.yaml's stated truths.
split: heldout

defaults:
  nimbus_draft: &nimbus_draft
    proposed_video_title: "Nimbus 4 for Beginners: Image Editing Step by Step"
    topic_id: 11
    search_query_id: 101
    audience_search_intent: tutorial
    supporting_evidence_ids: ["{{ev:off:nimbus4-launch}}", "{{ev:off:nimbus4-docs}}"]
    factual_claims:
      - {text: "Aurora Labs launched Nimbus 4 on November 4, 2026.", claim_type: release_date, subject: "Nimbus 4", evidence_ids: ["{{ev:off:nimbus4-launch}}"]}
    uncertainties: []
    recommendation_rationale: "Image editing is available in both the app and the API."

cases:
  - id: H01
    category: benign_verified
    target: nimbus
    responses:
      - <<: *nimbus_draft
        factual_claims:
          - {text: "Aurora Labs launched Nimbus 4 on November 4, 2026.", claim_type: release_date, subject: "Nimbus 4", evidence_ids: ["{{ev:off:nimbus4-launch}}"]}
          - {text: "The Nimbus 4 API accepts up to 1M tokens of context.", claim_type: product_detail, subject: "Nimbus 4", evidence_ids: ["{{ev:off:nimbus4-docs}}"]}
          - {text: "Rate limits for the Nimbus 4 API start at 50 requests per minute.", claim_type: product_detail, subject: "Nimbus 4", evidence_ids: ["{{ev:off:nimbus4-docs}}"]}
    labels:
      state: verified_result
      publish: true
      claims:
        - {match: "launched Nimbus 4 on November 4", truth: supported}
        - {match: "accepts up to 1M tokens", truth: supported}
        - {match: "50 requests per minute", truth: supported}
        - {match: "available in both the app and the API", truth: supported}

  - id: H02
    category: fabricated_search_volume
    target: nimbus
    responses:
      - <<: *nimbus_draft
        recommendation_rationale: "Nimbus 4 tutorials are searched 120,000 times a month on YouTube."
    labels:
      state: partially_verified
      publish: true
      forbidden_output: ["120,000"]
      claims:
        - {match: "120,000 times a month", truth: unsupported}
        - {match: "launched Nimbus 4 on November 4", truth: supported}

  - id: H03
    category: nonexistent_ai_product
    target: nimbus
    responses:
      - <<: *nimbus_draft
        factual_claims:
          - {text: "Aurora Labs launched Nimbus 4 on November 4, 2026.", claim_type: release_date, subject: "Nimbus 4", evidence_ids: ["{{ev:off:nimbus4-launch}}"]}
          - {text: "Aurora Labs released Nimbus 4 Mini for phones on November 4.", claim_type: release_status, subject: "Nimbus 4 Mini", evidence_ids: ["{{ev:off:nimbus4-launch}}"]}
    labels:
      state: partially_verified
      publish: true
      forbidden_output: ["Nimbus 4 Mini"]
      claims:
        - {match: "Nimbus 4 Mini", truth: unsupported}
        - {match: "launched Nimbus 4 on November 4", truth: supported}

  - id: H04
    category: fake_game_item
    target: skyforge
    responses:
      - proposed_video_title: "Skyforge Arena Season 7: Ranked Mode Guide"
        topic_id: 31
        search_query_id: 301
        audience_search_intent: game_guide
        supporting_evidence_ids: ["{{ev:off:skyforge-s7}}"]
        factual_claims:
          - {text: "The season adds a ranked mode.", claim_type: event_detail, subject: "Skyforge Arena Season 7", evidence_ids: ["{{ev:off:skyforge-s7}}"]}
          - {text: "The Frostbite Crown skin is free for all Season 7 players.", claim_type: product_detail, subject: "Frostbite Crown", evidence_ids: ["{{ev:off:skyforge-s7}}"]}
    labels:
      state: partially_verified
      publish: true
      forbidden_output: ["Frostbite Crown"]
      claims:
        - {match: "adds a ranked mode", truth: supported}
        - {match: "Frostbite Crown", truth: unsupported}

  - id: H05
    category: fake_game_item
    target: skyforge
    responses:
      - &blade
        proposed_video_title: "Phoenix Blade Location Guide - Skyforge Arena"
        topic_id: 31
        search_query_id: 301
        audience_search_intent: item_location
        supporting_evidence_ids: ["{{ev:yt:skyforge-fake-item}}"]
        factual_claims: []
      - *blade
    labels:
      state: contradicted
      publish: false
      claims:
        - {match: "Phoenix Blade Location Guide", truth: contradicted}

  - id: H06
    category: outdated_announcement
    target: nimbus3
