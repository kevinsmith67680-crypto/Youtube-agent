      - {hook_type: DIRECT_TUTORIAL, text: "Let's move a real project from Pyxis 4 to Pyxis 5 together and check every step as we go.", gold: ok}
    items:
      - {label: VERIFIED_FACT, text: "Pyxis 5 is released.", evidence: [ev_a4vylyyogkqnkdxgrzsa74zmsr], gold: supported}
      - {label: PLANNED_DEMONSTRATION, text: "Upgrade a sample project and show each change on screen", gold: plan}

  - id: ho-gaming-weak-evidence
    scenario: G
    video_format: ITEM_LOCATION_WALKTHROUGH
    acceptable_status: [RESEARCH_REQUIRED]
    titles:
      - {strategy: DIRECT_ANSWER, text: "Where to Find the Void Scythe in Skyforge Arena Season 8", gold: ok}
    hooks:
      - {hook_type: PROBLEM_FIRST, text: "Looking for the Void Scythe? We'll check every place the season update mentions, on camera.", gold: ok}
    items:
      - {label: VERIFIED_FACT, text: "Skyforge Arena Season 8: Emberfall is live.", evidence: [ev_awtki37xhtb5ebmvrrlflmjgdg], gold: supported}
      - {label: HYPOTHESIS_TO_TEST, text: "Is the Void Scythe obtainable in the current version?", gold: plan}

